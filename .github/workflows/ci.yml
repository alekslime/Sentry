# Sentry CI: full verification (tests + lint + format + types) on Windows
# and Linux, plus a minimal-install job proving graceful degradation.
#
# Tool versions are pinned here (not in pyproject.toml) so CI is hermetic:
# ruff/mypy add new rules over time, and an unpinned CI would break on
# releases nobody asked for. pyproject stays loose for local installs.

name: CI

on:
  push:
  pull_request:

env:
  # Keep in sync with the versions this repo was last verified against.
  RUFF_VERSION: "0.17.3"
  BLACK_VERSION: "26.10.1"
  MYPY_VERSION: "2.4.0"
  PYTEST_VERSION: "9.2.0"

jobs:
  full:
    name: full (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core libportaudio2 libgl1 libegl1

      - name: Install Tesseract OCR (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --no-progress -y
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Sentry with all extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[speech,llm,vision,tts,windows,dev]"
          python -m pip install "ruff==${{ env.RUFF_VERSION }}" "black==${{ env.BLACK_VERSION }}" "mypy==${{ env.MYPY_VERSION }}" "pytest==${{ env.PYTEST_VERSION }}"

      - name: Verify (tests + ruff + black + mypy)
        run: python scripts/verify.py

  minimal:
    # Core dependencies only: proves the app still imports and the
    # core suite passes with every optional extra missing (the extras'
    # test files skip with explicit reasons -- see the importorskip
    # guards at the top of each).
    name: minimal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux GUI/audio system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1

      - name: Install Sentry core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core test suite
        run: python -m pytest tests -q -rs
